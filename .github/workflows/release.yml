name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  LLAMA_CPP_REF: b12099

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require release signing
        env:
          HAVE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAVE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAVE_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAVE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' }}
          SIGNER_SHA256: ${{ vars.RELEASE_SIGNER_SHA256 }}
        run: |
          [[ "$HAVE_KEYSTORE" == true && "$HAVE_PASSWORD" == true && "$HAVE_ALIAS" == true && "$HAVE_KEY_PASSWORD" == true ]]
          [[ "$SIGNER_SHA256" =~ ^[[:xdigit:]]{64}$ ]]

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore on-device model runtimes
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: llama-server-three-abis-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-android.sh') }}

      - name: Build on-device model runtimes
        id: llama-build
        if: steps.llama-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/build-llama-android.sh

      - name: Cache completed native builds
        if: steps.llama-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          JARVIS_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          python3 scripts/check-apk-abis.py release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "Jarvis-${GITHUB_REF_NAME}-${abi}.apk"
          done
          cp app/build/outputs/apk/release/app-universal-release.apk "Jarvis-${GITHUB_REF_NAME}.apk"

      - name: Verify every public APK
        env:
          SIGNER_SHA256: ${{ vars.RELEASE_SIGNER_SHA256 }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for apk in Jarvis-"${GITHUB_REF_NAME}"*.apk; do
            certificates="$("$build_tools/apksigner" verify --print-certs "$apk")"
            digest="$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$certificates")"
            [[ "${digest,,}" == "${SIGNER_SHA256,,}" ]]
            [[ "$(apkanalyzer manifest debuggable "$apk")" == false ]]
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Jarvis-"${GITHUB_REF_NAME}"*.apk --title "Jarvis $GITHUB_REF_NAME" --generate-notes
