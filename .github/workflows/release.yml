name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  LLAMA_CPP_REF: b12099

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore on-device model runtimes
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: llama-server-three-abis-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-android.sh') }}

      - name: Build on-device model runtimes
        id: llama-build
        if: steps.llama-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/build-llama-android.sh

      - name: Cache completed native builds
        if: steps.llama-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          JARVIS_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          python3 scripts/check-apk-abis.py release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "Jarvis-${GITHUB_REF_NAME}-${abi}.apk"
          done
          cp app/build/outputs/apk/release/app-universal-release.apk "Jarvis-${GITHUB_REF_NAME}.apk"

      - name: Build debug APK (no signing key configured)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          ./gradlew assembleDebug
          python3 scripts/check-apk-abis.py debug
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "Jarvis-${GITHUB_REF_NAME}-${abi}.apk"
          done
          cp app/build/outputs/apk/debug/app-universal-debug.apk "Jarvis-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Jarvis-"${GITHUB_REF_NAME}"*.apk --title "Jarvis $GITHUB_REF_NAME" --generate-notes

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
