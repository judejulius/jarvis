name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REF: b12099

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache sherpa-onnx
        uses: actions/cache@v4
        with:
          path: app/libs/*.aar
          key: sherpa-onnx-${{ hashFiles('app/build.gradle.kts') }}

      - name: Cache on-device model runtime
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libllama_server.so
          key: llama-server-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-android.sh') }}

      # llama-server for arm64 is built from source once (then cached). If this step fails, the APK still builds; the app
      # then works without the on-device runtime (Termux or cloud models).
      - name: Build on-device model runtime (llama-server, arm64)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/build-llama-android.sh

      # The APK is built and uploaded first, so a failing test or lint rule never hides an installable build.
      # The tests and lint still run below and still turn the workflow red when they fail.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Upload test and lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
